[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-slop-cleaner"
version = "0.1.0"
description = "MCP server for improving generic, repetitive AI-generated text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.2.0",
  "openai>=1.60.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_slop_cleaner"]
